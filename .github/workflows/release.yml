name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned for reproducibility)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: armv7-unknown-linux-musleabihf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: k4refresh-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Run unit tests (host)
        run: cargo test

      # 方案 A（v0.1.8）：gnueabihf 动态产物停产（K4 用户态 armel，
      # armhf 动态件无法加载/运行，readme §7）；仅构建 musl 静态 CLI。
      - name: Build ARM static CLI (musl, zero-dependency)
        run: cargo build --release --target armv7-unknown-linux-musleabihf
        # .cargo/config.toml 已配置 rust-lld 自包含链接

      - name: Package release zip
        run: |
          ST="k4refresh-${GITHUB_REF_NAME}-arm"
          mkdir -p "$ST/lua" "$ST/kual/bin"
          cp target/armv7-unknown-linux-musleabihf/release/k4refresh-cli "$ST/k4refresh-cli"
          cp lua/k4refresh.lua "$ST/lua/"
          cp -r koplugin/k4refresh.koplugin "$ST/"
          cp kual/config.xml "$ST/kual/"
          cp kual/menu.json "$ST/kual/"
          cp kual/k4r.sh "$ST/kual/bin/"
          cp target/armv7-unknown-linux-musleabihf/release/k4refresh-cli "$ST/kual/bin/k4refresh-cli"
          cat > "$ST/INSTALL.txt" <<'EOF'
          k4refresh 安装速查（前置：越狱 + KUAL + KOReader；IP 按实际调整）
          在解压目录内执行：

            ssh root@192.168.15.244 "mkdir -p /mnt/us/k4refresh /mnt/us/extensions/k4refresh/bin /mnt/us/koreader/plugins"
            scp k4refresh-cli                 root@192.168.15.244:/mnt/us/k4refresh/
            scp k4refresh-cli                 root@192.168.15.244:/mnt/us/extensions/k4refresh/bin/
            scp kual/config.xml               root@192.168.15.244:/mnt/us/extensions/k4refresh/
            scp kual/menu.json                root@192.168.15.244:/mnt/us/extensions/k4refresh/
            scp kual/bin/k4r.sh               root@192.168.15.244:/mnt/us/extensions/k4refresh/bin/
            scp lua/k4refresh.lua             root@192.168.15.244:/mnt/us/koreader/
            scp -r k4refresh.koplugin         root@192.168.15.244:/mnt/us/koreader/plugins/
            ssh root@192.168.15.244 "chmod +x /mnt/us/k4refresh/* /mnt/us/extensions/k4refresh/bin/* && sync"

          部署后冒烟（任一失败立即停用并卸载）：
            ssh root@192.168.15.244
            /mnt/us/k4refresh/k4refresh-cli --version
            /mnt/us/k4refresh/k4refresh-cli info     # 预期 600x800, bpp=8
            /mnt/us/k4refresh/k4refresh-cli flash    # 预期屏幕闪烁一次

          使用：KUAL → K4Refresh（AB-A/AB-B 残影拍照、Quantize now、
            Duokan Quant On/Off、ghost 档位；ghost 档位开书后生效）；
          KOReader 主菜单 → K4Refresh (ghost clearing)（即时生效）：
            Duokan quant: On/Off      16 级量化开关（建议 On）
            Ghost: Every 4/6/8 Pages  slow 收尾档位
            Full Refresh now (slow)   手动清残影
          推荐配置（真机验收组合）：mode.conf = "ghost 4" + "quant on"。
          部署/更新后需重启 KOReader（插件只在启动时扫描 plugins/）。
          卸载：rm -rf /mnt/us/extensions/k4refresh /mnt/us/k4refresh
                /mnt/us/koreader/plugins/k4refresh.koplugin
                && rm -f /mnt/us/koreader/k4refresh.lua
          完整文档：https://github.com/dororo42/k4refresh#readme
          EOF
          cd "$ST"
          find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} + | sort > SHA256SUMS.txt
          cd ..
          zip -r "${ST}.zip" "$ST"
          sha256sum "${ST}.zip" > "${ST}.zip.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ST="k4refresh-${GITHUB_REF_NAME}-arm"
          cat > release_notes.md <<EOF
          ## k4refresh ${GITHUB_REF_NAME}

          Kindle 4（legacy einkfb）刷屏策略控制器。zip 内容：静态 CLI、
          KOReader Lua 桥、KOReader 插件（重影优先模式：每 N 页自动 slow 收尾
          清残影）、KUAL 扩展、INSTALL.txt、SHA256SUMS.txt。

          ### v${GITHUB_REF_NAME} 亮点
          - 方案 A（FFI 停用）：K4 用户态 armel（glibc 2.12.1），gnueabihf 的
            libk4refresh.so 无法 dlopen（已知边界）。zip 不再分发 .so 与动态 CLI；
            插件/Lua 桥默认直接走静态 CLI，不再每次启动空转 FFI 探测。
            armel .so 重建（koxtoolchain）落地后：touch /mnt/us/k4refresh/ffi.enabled
            即恢复 FFI 探测，无需改代码。
          - _meta.lua 去掉已弃用的 name 字段（消除 PluginLoader 告警）。
          - ghost 接管还原行为修正：关闭 ghost 时还原接管前的内置全刷档位
            （v0.1.7 硬编码 6，会覆盖用户自定义档），且 0 不再落盘。
          - KUAL 菜单：Ghost Off / Every 4 / Every 6 / Every 8 多档。
          - bench：--shot-idx 为 0-based（第 N+1 次刷新显示横幅），文档已注明。

          ### 安装
          解压后按包内 \`INSTALL.txt\` 逐条执行（前置：越狱 + KUAL + KOReader）。

          ### 冒烟（任一失败立即停用）
          \`\`\`
          /mnt/us/k4refresh/k4refresh-cli info    # 预期 600x800, bpp=8
          /mnt/us/k4refresh/k4refresh-cli flash   # 预期屏幕闪烁一次
          \`\`\`

          ### 回滚
          \`\`\`
          rm -rf /mnt/us/extensions/k4refresh /mnt/us/k4refresh \\
                 /mnt/us/koreader/plugins/k4refresh.koplugin
          rm -f /mnt/us/koreader/k4refresh.lua
          \`\`\`

          ⚠️ 残影改善的感知验收结论：ghost 6 下可接受（v0.1.7 实测）。部署后先按
          上方冒烟命令验证基础链路，异常即卸载。详见 README 已知边界。
          EOF
          gh release create "$GITHUB_REF_NAME" "${ST}.zip" "${ST}.zip.sha256" \
            --title "k4refresh ${GITHUB_REF_NAME}" --notes-file release_notes.md
